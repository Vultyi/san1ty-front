name: Build APK release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable, cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/san1ty-release.jks
          ls -la android/app/san1ty-release.jks

      - name: Recreate android/key.properties from secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=san1ty-release.jks
          EOF
          cat android/key.properties | sed 's/^storePassword=.*/storePassword=***/;s/^keyPassword=.*/keyPassword=***/'

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish Release build-${{ github.run_number }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
